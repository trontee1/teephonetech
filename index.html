<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teephonetech | Phones & Gadgets</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f5f5f7;
      color: #111;
    }

    header {
      background: #000;
      color: #fff;
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .cart-button {
      background: #fff;
      color: #000;
      border: 0;
      padding: 10px 16px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      min-height: 430px;
      background: linear-gradient(135deg, #000, #222);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 {
      font-size: clamp(40px, 8vw, 75px);
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      color: #ddd;
      margin-bottom: 25px;
    }

    .hero-btn {
      display: inline-block;
      background: white;
      color: black;
      padding: 14px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 55px 6%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-title h2 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .section-title p {
      color: #666;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .category-btn {
      border: 1px solid #ddd;
      background: white;
      padding: 11px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
    }

    .category-btn.active {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .product {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-4px);
    }

    .product-image {
      height: 220px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .phone-placeholder {
      font-size: 75px;
    }

    .product-info {
      padding: 18px;
    }

    .product-info h3 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .description {
      color: #777;
      font-size: 14px;
      min-height: 35px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .stock {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .add-btn {
      width: 100%;
      border: 0;
      background: #000;
      color: #fff;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 50px;
      color: #777;
      grid-column: 1 / -1;
    }

    footer {
      background: #000;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 3000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-box {
      background: white;
      max-width: 650px;
      margin: 40px auto;
      border-radius: 20px;
      padding: 25px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 18px;
      top: 12px;
      font-size: 30px;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item-info {
      flex: 1;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .remove {
      border: 0;
      background: #eee;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .total {
      font-size: 23px;
      font-weight: bold;
      text-align: right;
      padding: 20px 0;
    }

    form {
      display: grid;
      gap: 13px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .checkout-btn {
      background: #000;
      color: white;
      border: 0;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      padding: 13px;
      border-radius: 10px;
      display: none;
      margin-bottom: 15px;
    }

    .success {
      background: #d9f7df;
      color: #146b28;
    }

    .error {
      background: #ffe0e0;
      color: #a40000;
    }

    @media (max-width: 650px) {
      header {
        padding: 15px 4%;
      }

      nav a {
        display: none;
      }

      section {
        padding: 45px 4%;
      }

      .product-image {
        height: 200px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Teephonetech</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <button class="cart-button" onclick="openCart()">
      Cart (<span id="cartCount">0</span>)
    </button>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h1>Teephonetech</h1>
    <p>Premium Phones, Gadgets & Accessories</p>
    <a href="#products" class="hero-btn">Shop Now</a>
  </div>
</section>

<section id="products">

  <div class="section-title">
    <h2>Our Products</h2>
    <p>Choose your phone or gadget</p>
  </div>

  <div class="categories" id="categories">
    <button class="category-btn active" onclick="filterProducts('all', this)">
      All
    </button>
  </div>

  <div class="products" id="productList">
    <div class="loading">Loading products...</div>
  </div>

</section>

<footer>
  <h2>Teephonetech</h2>
  <p>Phones & Gadgets</p>
  <br>
  <p>© 2026 Teephonetech. All rights reserved.</p>
</footer>


<!-- CART MODAL -->

<div class="modal" id="cartModal">

  <div class="modal-box">

    <button class="close" onclick="closeCart()">×</button>

    <h2>Your Cart</h2>

    <br>

    <div id="cartItems"></div>

    <div class="total">
      Total: ₦<span id="cartTotal">0</span>
    </div>

    <button class="checkout-btn" onclick="showCheckout()">
      Continue to Checkout
    </button>

  </div>

</div>


<!-- CHECKOUT MODAL -->

<div class="modal" id="checkoutModal">

  <div class="modal-box">

    <button class="close" onclick="closeCheckout()">×</button>

    <h2>Delivery Details</h2>

    <br>

    <div id="checkoutMessage" class="message"></div>

    <form id="checkoutForm">

      <input
        type="text"
        id="customerName"
        placeholder="Full Name"
        required
      >

      <input
        type="tel"
        id="customerPhone"
        placeholder="Phone Number"
        required
      >

      <input
        type="email"
        id="customerEmail"
        placeholder="Email Address (optional)"
      >

      <textarea
        id="deliveryAddress"
        placeholder="Delivery Address"
        required
      ></textarea>

      <button class="checkout-btn" type="submit">
        Place Order
      </button>

    </form>

  </div>

</div>


<script>

  /* =====================================
     SUPABASE CONNECTION
     ===================================== */

  const SUPABASE_URL =
    "https://tkuchpmckxkvpcuwsfvn.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_yBg6fW-hMNmqguH4zeYgxw_DNW6TbrZ";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /* =====================================
     VARIABLES
     ===================================== */

  let products = [];
  let cart = [];
  let currentCategory = "all";


  /* =====================================
     LOAD PRODUCTS
     ===================================== */

  async function loadProducts() {

    const productList =
      document.getElementById("productList");

    productList.innerHTML =
      '<div class="loading">Loading products...</div>';

    const { data, error } = await db
      .from("products")
      .select("*")
      .eq("active", true)
      .order("created_at", { ascending: false });

    if (error) {

      console.error(error);

      productList.innerHTML = `
        <div class="empty">
          <h3>Unable to load products</h3>
          <p>Please refresh the page.</p>
        </div>
      `;

      return;
    }

    products = data || [];

    createCategories();

    displayProducts();

  }


  /* =====================================
     CREATE CATEGORIES
     ===================================== */

  function createCategories() {

    const categories =
      [...new Set(products.map(p => p.category))];

    const container =
      document.getElementById("categories");

    container.innerHTML = `
      <button
        class="category-btn active"
        onclick="filterProducts('all', this)"
      >
        All
      </button>
    `;

    categories.forEach(category => {

      const button =
        document.createElement("button");

      button.className = "category-btn";

      button.textContent = category;

      button.onclick = function () {
        filterProducts(category, this);
      };

      container.appendChild(button);

    });

  }


  /* =====================================
     DISPLAY PRODUCTS
     ===================================== */

  function displayProducts() {

    const container =
      document.getElementById("productList");

    let list = products;

    if (currentCategory !== "all") {

      list = products.filter(
        product =>
          product.category === currentCategory
      );

    }

    if (!list.length) {

      container.innerHTML =
        '<div class="empty">No products available.</div>';

      return;
    }

    container.innerHTML = "";

    list.forEach(product => {

      const card =
        document.createElement("div");

      card.className = "product";

      const image = product.image_url
        ? `
          <img
            src="${escapeHtml(product.image_url)}"
            alt="${escapeHtml(product.name)}"
          >
        `
        : `
          <div class="phone-placeholder">📱</div>
        `;

      const price =
        Number(product.price).toLocaleString("en-NG");

      card.innerHTML = `

        <div class="product-image">
          ${image}
        </div>

        <div class="product-info">

          <h3>${escapeHtml(product.name)}</h3>

          <div class="description">
            ${escapeHtml(product.description || "")}
          </div>

          <div class="price">
            ${Number(product.price) > 0
              ? "₦" + price
              : "Contact Us"}
          </div>

          <div class="stock">
            ${product.stock > 0
              ? product.stock + " available"
              : "Out of stock"}
          </div>

          <button
            class="add-btn"
            onclick="addToCart(${product.id})"
            ${product.stock <= 0 ? "disabled" : ""}
          >
            ${product.stock > 0
              ? "Add to Cart"
              : "Out of Stock"}
          </button>

        </div>
      `;

      container.appendChild(card);

    });

  }


  /* =====================================
     FILTER
     ===================================== */

  function filterProducts(category, button) {

    currentCategory = category;

    document
      .querySelectorAll(".category-btn")
      .forEach(btn =>
        btn.classList.remove("active")
      );

    button.classList.add("active");

    displayProducts();

  }


  /* =====================================
     CART
     ===================================== */

  function addToCart(productId) {

    const product =
      products.find(p => p.id === productId);

    if (!product) return;

    const existing =
      cart.find(item => item.id === productId);

    if (existing) {

      if (existing.quantity < product.stock) {
        existing.quantity++;
      } else {
        alert("You cannot add more than available stock.");
        return;
      }

    } else {

      cart.push({
        ...product,
        quantity: 1
      });

    }

    updateCart();

    alert(product.name + " added to cart.");

  }


  function updateCart() {

    const count =
      cart.reduce(
        (total, item) =>
          total + item.quantity,
        0
      );

    document.getElementById("cartCount")
      .textContent = count;

    const total =
      cart.reduce(
        (sum, item) =>
          sum + Number(item.price) * item.quantity,
        0
      );

    document.getElementById("cartTotal")
      .textContent =
      total.toLocaleString("en-NG");

  }


  function renderCart() {

    const container =
      document.getElementById("cartItems");

    if (!cart.length) {

      container.innerHTML = `
        <div class="empty">
          Your cart is empty.
        </div>
      `;

      return;

    }

    container.innerHTML = "";

    cart.forEach(item => {

      const row =
        document.createElement("div");

      row.className = "cart-item";

      row.innerHTML = `

        <div class="cart-item-info">

          <strong>${escapeHtml(item.name)}</strong>

          <br>

          ₦${Number(item.price)
            .toLocaleString("en-NG")}

        </div>

        <div class="quantity">

          <button
            onclick="changeQuantity(${item.id}, -1)"
          >
            −
          </button>

          <strong>${item.quantity}</strong>

          <button
            onclick="changeQuantity(${item.id}, 1)"
          >
            +
          </button>

        </div>

        <button
          class="remove"
          onclick="removeFromCart(${item.id})"
        >
          Remove
        </button>

      `;

      container.appendChild(row);

    });

  }


  function changeQuantity(id, amount) {

    const item =
      cart.find(product => product.id === id);

    if (!item) return;

    const newQuantity =
      item.quantity + amount;

    if (newQuantity <= 0) {

      removeFromCart(id);

      return;

    }

    if (newQuantity > item.stock) {

      alert("Not enough stock.");

      return;

    }

    item.quantity = newQuantity;

    updateCart();

    renderCart();

  }


  function removeFromCart(id) {

    cart =
      cart.filter(item => item.id !== id);

    updateCart();

    renderCart();

  }


  /* =====================================
     CART MODAL
     ===================================== */

  function openCart() {

    renderCart();

    document.getElementById("cartModal")
      .style.display = "block";

  }


  function closeCart() {

    document.getElementById("cartModal")
      .style.display = "none";

  }


  /* =====================================
     CHECKOUT
     ===================================== */

  function showCheckout() {

    if (!cart.length) {

      alert("Your cart is empty.");

      return;

    }

    closeCart();

    document.getElementById("checkoutModal")
      .style.display = "block";

  }


  function closeCheckout() {

    document.getElementById("checkoutModal")
      .style.display = "none";

  }


  /* =====================================
     PLACE ORDER
     ===================================== */

  document
    .getElementById("checkoutForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      if (!cart.length) {

        alert("Your cart is empty.");

        return;

      }

      const button =
        this.querySelector("button[type='submit']");

      button.disabled = true;

      button.textContent = "Placing Order...";

      const message =
        document.getElementById("checkoutMessage");

      message.style.display = "none";

      try {

        const customerName =
          document.getElementById("customerName")
            .value.trim();

        const customerPhone =
          document.getElementById("customerPhone")
            .value.trim();

        const customerEmail =
          document.getElementById("customerEmail")
            .value.trim();

        const deliveryAddress =
          document.getElementById("deliveryAddress")
            .value.trim();


        const total =
          cart.reduce(
            (sum, item) =>
              sum +
              Number(item.price) *
              item.quantity,
            0
          );


        /* Create order */

        const { data: order, error: orderError } =
          await db
            .from("orders")
            .insert({
              customer_name: customerName,
              customer_phone: customerPhone,
              customer_email:
                customerEmail || null,
              delivery_address: deliveryAddress,
              total_amount: total,
              payment_status: "pending",
              order_status: "pending"
            })
            .select()
            .single();


        if (orderError) {
          throw orderError;
        }


        /* Create order items */

        const orderItems =
          cart.map(item => ({
            order_id: order.id,
            product_id: item.id,
            product_name: item.name,
            quantity: item.quantity,
            unit_price: Number(item.price)
          }));


        const { error: itemsError } =
          await db
            .from("order_items")
            .insert(orderItems);


        if (itemsError) {
          throw itemsError;
        }


        /* Success */

        message.className =
          "message success";

        message.style.display = "block";

        message.innerHTML = `
          <strong>Order placed successfully!</strong><br>
          Order #${order.id}
        `;


        cart = [];

        updateCart();

        this.reset();

        setTimeout(() => {

          closeCheckout();

          message.style.display = "none";

        }, 3000);


      } catch (error) {

        console.error(error);

        message.className =
          "message error";

        message.style.display = "block";

        message.textContent =
          "Something went wrong. Please try again.";

      }


      button.disabled = false;

      button.textContent = "Place Order";

    });


  /* =====================================
     SECURITY / HTML ESCAPE
     ===================================== */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================
     START WEBSITE
     ===================================== */

  loadProducts();

</script>

</body>
</html>
