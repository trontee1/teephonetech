<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teephonetech | Phones & Gadgets</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    header {
      background: #000;
      color: white;
      padding: 28px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .cart-btn {
      background: white;
      color: black;
      border: none;
      border-radius: 30px;
      padding: 15px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .hero {
      min-height: 390px;
      background: linear-gradient(135deg, #111, #222);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 20px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 80px);
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      font-size: 20px;
      margin-bottom: 30px;
    }

    .shop-btn {
      display: inline-block;
      background: white;
      color: black;
      padding: 18px 35px;
      border-radius: 35px;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .products-section {
      padding: 75px 6%;
      min-height: 500px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: clamp(38px, 6vw, 60px);
      margin-bottom: 15px;
    }

    .section-title p {
      color: #666;
      font-size: 20px;
    }

    .categories {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 40px;
    }

    .category-btn {
      border: none;
      background: #ddd;
      padding: 12px 22px;
      border-radius: 25px;
      font-weight: 700;
      cursor: pointer;
    }

    .category-btn.active {
      background: #000;
      color: white;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      padding-bottom: 20px;
    }

    .product-image {
      width: 100%;
      height: 230px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      font-size: 65px;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .description {
      color: #777;
      min-height: 42px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stock {
      color: #555;
      margin-bottom: 15px;
    }

    .add-btn {
      width: 100%;
      border: none;
      background: #000;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .loading,
    .error {
      text-align: center;
      padding: 50px 20px;
      color: #777;
      font-size: 20px;
    }

    .error {
      color: #c00;
    }

    footer {
      background: #000;
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    footer h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    footer p {
      color: #ccc;
    }

    /* CART */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 500;
    }

    .overlay.show {
      display: block;
    }

    .cart-panel {
      position: fixed;
      right: 0;
      top: 0;
      height: 100%;
      width: min(430px, 100%);
      background: white;
      z-index: 600;
      transform: translateX(100%);
      transition: .3s;
      padding: 25px;
      overflow-y: auto;
    }

    .cart-panel.show {
      transform: translateX(0);
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .close-btn {
      border: none;
      background: #eee;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info h4 {
      margin-bottom: 5px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .qty-controls button {
      width: 30px;
      height: 30px;
      border: none;
      background: #eee;
      border-radius: 8px;
      cursor: pointer;
    }

    .cart-total {
      font-size: 24px;
      font-weight: 800;
      margin: 25px 0;
    }

    .checkout-btn {
      width: 100%;
      padding: 16px;
      border: none;
      background: #000;
      color: white;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    /* CHECKOUT */
    .checkout-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 700;
      padding: 20px;
      overflow-y: auto;
    }

    .checkout-modal.show {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .checkout-box {
      background: white;
      width: min(550px, 100%);
      margin: 30px auto;
      padding: 30px;
      border-radius: 20px;
    }

    .checkout-box h2 {
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .submit-order {
      width: 100%;
      padding: 16px;
      border: none;
      background: #000;
      color: white;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .cancel-order {
      width: 100%;
      padding: 14px;
      border: none;
      background: #eee;
      color: #111;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 18px;
      }

      .logo {
        font-size: 23px;
      }

      .cart-btn {
        padding: 12px 17px;
      }

      .products-section {
        padding: 55px 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Teephonetech</div>
  <button class="cart-btn" onclick="openCart()">
    Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <div>
    <h1>Teephonetech</h1>
    <p>Premium Phones, Gadgets & Accessories</p>
    <a href="#products" class="shop-btn">Shop Now</a>
  </div>
</section>

<section class="products-section" id="products">

  <div class="section-title">
    <h2>Our Products</h2>
    <p>Choose your phone or gadget</p>
  </div>

  <div class="categories" id="categories">
    <button class="category-btn active" onclick="filterProducts('All', this)">
      All
    </button>
  </div>

  <div id="productsContainer" class="products-grid">
    <div class="loading">Loading products...</div>
  </div>

</section>

<footer>
  <h2>Teephonetech</h2>
  <p>Phones & Gadgets</p>
  <br>
  <p>© 2026 Teephonetech. All rights reserved.</p>
</footer>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cart-panel" id="cartPanel">

  <div class="cart-header">
    <h2>Your Cart</h2>
    <button class="close-btn" onclick="closeCart()">×</button>
  </div>

  <div id="cartItems"></div>

  <div class="cart-total">
    Total: ₦<span id="cartTotal">0</span>
  </div>

  <button class="checkout-btn" onclick="openCheckout()">
    Checkout
  </button>

</div>

<div class="checkout-modal" id="checkoutModal">

  <div class="checkout-box">

    <div class="cart-header">
      <h2>Checkout</h2>
      <button class="close-btn" onclick="closeCheckout()">×</button>
    </div>

    <form id="checkoutForm">

      <div class="form-group">
        <label>Full Name</label>
        <input id="customerName" type="text" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input id="customerPhone" type="tel" required>
      </div>

      <div class="form-group">
        <label>Email (optional)</label>
        <input id="customerEmail" type="email">
      </div>

      <div class="form-group">
        <label>Delivery Address</label>
        <textarea id="deliveryAddress" required></textarea>
      </div>

      <button class="submit-order" type="submit">
        Place Order
      </button>

      <button class="cancel-order" type="button" onclick="closeCheckout()">
        Cancel
      </button>

    </form>

  </div>
</div>

<script>

  /* =========================
     SUPABASE CONNECTION
  ========================= */

  const SUPABASE_URL =
    "https://tkuchpmckxkvpcuwsfvn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_yBg6fW-hMNmqguH4zeYgxw_DNW6TbrZ";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =========================
     VARIABLES
  ========================= */

  let products = [];
  let cart = [];
  let currentCategory = "All";


  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {

    const container =
      document.getElementById("productsContainer");

    container.innerHTML =
      '<div class="loading">Loading products...</div>';

    try {

      const { data, error } = await db
        .from("products")
        .select("*")
        .eq("active", true)
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Supabase error:", error);
        throw error;
      }

      products = data || [];

      createCategories();
      displayProducts();

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="error">
          <strong>Unable to load products</strong>
          <br>
          <small>Please refresh the page.</small>
        </div>
      `;

    }

  }


  /* =========================
     CATEGORIES
  ========================= */

  function createCategories() {

    const categories =
      [...new Set(
        products
          .map(product => product.category)
          .filter(Boolean)
      )];

    const container =
      document.getElementById("categories");

    container.innerHTML = `
      <button
        class="category-btn active"
        onclick="filterProducts('All', this)">
        All
      </button>
    `;

    categories.forEach(category => {

      const button =
        document.createElement("button");

      button.className = "category-btn";
      button.textContent = category;

      button.onclick = function() {
        filterProducts(category, this);
      };

      container.appendChild(button);

    });

  }


  function filterProducts(category, button) {

    currentCategory = category;

    document
      .querySelectorAll(".category-btn")
      .forEach(btn =>
        btn.classList.remove("active")
      );

    button.classList.add("active");

    displayProducts();

  }


  /* =========================
     DISPLAY PRODUCTS
  ========================= */

  function displayProducts() {

    const container =
      document.getElementById("productsContainer");

    let list = products;

    if (currentCategory !== "All") {

      list = products.filter(
        product =>
          product.category === currentCategory
      );

    }

    if (!list.length) {

      container.innerHTML =
        '<div class="loading">No products available.</div>';

      return;
    }

    container.innerHTML = "";

    list.forEach(product => {

      const card =
        document.createElement("div");

      card.className = "product-card";

      const image =
        product.image_url
          ? `<img src="${escapeHtml(product.image_url)}"
                  alt="${escapeHtml(product.name)}">`
          : `<div class="placeholder">📱</div>`;

      const stock =
        Number(product.stock || 0);

      card.innerHTML = `

        <div class="product-image">
          ${image}
        </div>

        <div class="product-info">

          <h3>${escapeHtml(product.name)}</h3>

          <p class="description">
            ${escapeHtml(product.description || "")}
          </p>

          <div class="price">
            ₦${formatMoney(product.price)}
          </div>

          <div class="stock">
            ${stock > 0
              ? stock + " in stock"
              : "Out of stock"}
          </div>

          <button
            class="add-btn"
            ${stock <= 0 ? "disabled" : ""}
            onclick="addToCart(${product.id})">

            ${stock > 0
              ? "Add to Cart"
              : "Out of Stock"}

          </button>

        </div>
      `;

      container.appendChild(card);

    });

  }


  /* =========================
     CART
  ========================= */

  function addToCart(productId) {

    const product =
      products.find(p => p.id === productId);

    if (!product) return;

    const existing =
      cart.find(item => item.id === productId);

    if (existing) {

      if (existing.quantity < Number(product.stock)) {
        existing.quantity++;
      }

    } else {

      cart.push({
        id: product.id,
        name: product.name,
        price: Number(product.price || 0),
        quantity: 1,
        stock: Number(product.stock || 0)
      });

    }

    saveCart();
    renderCart();
    updateCartCount();

  }


  function changeQuantity(id, amount) {

    const item =
      cart.find(item => item.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

      cart =
        cart.filter(item => item.id !== id);

    } else if (item.quantity > item.stock) {

      item.quantity = item.stock;

    }

    saveCart();
    renderCart();
    updateCartCount();

  }


  function renderCart() {

    const container =
      document.getElementById("cartItems");

    if (!cart.length) {

      container.innerHTML =
        '<p>Your cart is empty.</p>';

      document.getElementById("cartTotal").textContent =
        "0";

      return;

    }

    container.innerHTML = "";

    let total = 0;

    cart.forEach(item => {

      const itemTotal =
        item.price * item.quantity;

      total += itemTotal;

      const div =
        document.createElement("div");

      div.className = "cart-item";

      div.innerHTML = `

        <div class="cart-item-info">

          <h4>${escapeHtml(item.name)}</h4>

          <div>
            ₦${formatMoney(item.price)}
          </div>

          <div class="qty-controls">

            <button
              onclick="changeQuantity(${item.id}, -1)">
              −
            </button>

            <strong>${item.quantity}</strong>

            <button
              onclick="changeQuantity(${item.id}, 1)">
              +
            </button>

          </div>

        </div>
      `;

      container.appendChild(div);

    });

    document.getElementById("cartTotal").textContent =
      formatMoney(total);

  }


  function updateCartCount() {

    const count =
      cart.reduce(
        (sum, item) => sum + item.quantity,
        0
      );

    document.getElementById("cartCount")
      .textContent = count;

  }


  function saveCart() {

    localStorage.setItem(
      "teephonetech_cart",
      JSON.stringify(cart)
    );

  }


  function loadCart() {

    try {

      cart =
        JSON.parse(
          localStorage.getItem(
            "teephonetech_cart"
          )
        ) || [];

    } catch {

      cart = [];

    }

    renderCart();
    updateCartCount();

  }


  /* =========================
     CART OPEN/CLOSE
  ========================= */

  function openCart() {

    document
      .getElementById("cartPanel")
      .classList.add("show");

    document
      .getElementById("overlay")
      .classList.add("show");

    renderCart();

  }


  function closeCart() {

    document
      .getElementById("cartPanel")
      .classList.remove("show");

    document
      .getElementById("overlay")
      .classList.remove("show");

  }


  /* =========================
     CHECKOUT
  ========================= */

  function openCheckout() {

    if (!cart.length) {

      alert("Your cart is empty.");

      return;

    }

    closeCart();

    document
      .getElementById("checkoutModal")
      .classList.add("show");

  }


  function closeCheckout() {

    document
      .getElementById("checkoutModal")
      .classList.remove("show");

  }


  document
    .getElementById("checkoutForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      if (!cart.length) {

        alert("Your cart is empty.");
        return;

      }

      const button =
        document.querySelector(".submit-order");

      button.disabled = true;
      button.textContent = "Placing Order...";

      try {

        const customerName =
          document.getElementById("customerName").value.trim();

        const customerPhone =
          document.getElementById("customerPhone").value.trim();

        const customerEmail =
          document.getElementById("customerEmail").value.trim();

        const deliveryAddress =
          document.getElementById("deliveryAddress").value.trim();

        const total =
          cart.reduce(
            (sum, item) =>
              sum + item.price * item.quantity,
            0
          );


        /* CREATE ORDER */

const itemsForRpc = cart.map(item => ({
    product_id: item.id,
    quantity: item.quantity
}));

const { data: orderId, error: orderError } =
    await db.rpc("create_customer_order", {
        p_customer_name: customerName,
        p_customer_phone: customerPhone,
        p_customer_email: customerEmail || "",
        p_delivery_address: deliveryAddress,
        p_items: itemsForRpc
    });

if (orderError) {
    throw orderError;
}

const order = {
    id: orderId
};


        /* SUCCESS */

        cart = [];

        saveCart();
        renderCart();
        updateCartCount();
        closeCheckout();

        alert(
          "Order placed successfully! Your order number is #" +
          order.id
        );

        document
          .getElementById("checkoutForm")
          .reset();

      } catch (error) {

        console.error("Order error:", error);

        alert(
          "Sorry, we could not place your order. Please try again."
        );

      } finally {

        button.disabled = false;
        button.textContent = "Place Order";

      }

    });


  /* =========================
     SECURITY / HELPERS
  ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatMoney(value) {

    return Number(value || 0)
      .toLocaleString("en-NG", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });

  }


  /* =========================
     START
  ========================= */

  loadCart();
  loadProducts();

</script>

</body>
</html>
