<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teephonetech Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#111;
}
header{
    background:#111;
    color:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header h1{margin:0;font-size:22px}
button{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
}
.logout{background:#e53935;color:white}
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.login{
    max-width:420px;
    margin:80px auto;
}
input,select,textarea{
    width:100%;
    padding:13px;
    margin:7px 0 14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}
textarea{min-height:90px}
.primary{
    background:#111;
    color:white;
    width:100%;
}
.hidden{display:none}
.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    background:#eee;
}
.product{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
}
.product-top{
    display:flex;
    gap:15px;
    align-items:center;
}
.product img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
    background:#eee;
}
.product-info{flex:1}
.product-info h3{margin:0 0 7px}
.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}
.edit{background:#1976d2;color:white}
.delete{background:#e53935;color:white}
.status{background:#eee}
.order{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
}
.small{font-size:13px;color:#666}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
@media(max-width:650px){
    .grid{grid-template-columns:1fr}
    .product-top{align-items:flex-start}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login card">
    <h2>Teephonetech Admin</h2>
    <p>Login to manage your store.</p>

    <div id="loginMessage"></div>

    <label>Email</label>
    <input id="email" type="email" placeholder="Admin email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button class="primary" onclick="login()">Login</button>
</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<header>
    <h1>Teephonetech Admin</h1>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <div id="dashboardMessage"></div>

    <!-- ADD PRODUCT -->
    <div class="card">
        <h2 id="formTitle">Add Product</h2>

        <input type="hidden" id="productId">

        <label>Product Name</label>
        <input id="productName" placeholder="e.g. iPhone 17 Pro Max">

        <label>Description</label>
        <textarea id="productDescription" placeholder="Product description"></textarea>

        <div class="grid">

            <div>
                <label>Price (₦)</label>
                <input id="productPrice" type="number" placeholder="500000">
            </div>

            <div>
                <label>Stock</label>
                <input id="productStock" type="number" placeholder="10">
            </div>

        </div>

        <label>Category</label>
        <select id="productCategory">
            <option>iPhone</option>
            <option>Samsung Galaxy</option>
            <option>Other Phones</option>
            <option>Gadgets</option>
        </select>

        <label>Product Image URL</label>
        <input id="productImage" placeholder="https://example.com/image.jpg">

        <label>
            <input id="productActive" type="checkbox" checked style="width:auto">
            Product is active
        </label>

        <button class="primary" onclick="saveProduct()">Save Product</button>
        <button id="cancelEdit" class="hidden" onclick="cancelEdit()" style="margin-top:10px;width:100%">
            Cancel Edit
        </button>
    </div>


    <!-- PRODUCTS -->
    <div class="card">
        <h2>Products</h2>
        <div id="products">Loading products...</div>
    </div>


    <!-- ORDERS -->
    <div class="card">
        <h2>Customer Orders</h2>
        <div id="orders">Loading orders...</div>
    </div>

</div>
</div>


<script>

const SUPABASE_URL = "https://tkuchpmckxkvpcuwsfvn.supabase.co";

const SUPABASE_KEY = "sb_publishable_yBg6fW-hMNmqguH4zeYgxw_DNW6TbrZ";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ---------------- LOGIN ----------------

async function login(){

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("loginMessage");

    if(!email || !password){
        message.innerHTML = '<div class="message">Enter your email and password.</div>';
        return;
    }

    message.innerHTML = '<div class="message">Logging in...</div>';

    const { data, error } = await db.auth.signInWithPassword({
        email,
        password
    });

    if(error){
        message.innerHTML =
            '<div class="message">' + error.message + '</div>';
        return;
    }

    await checkAdmin();

}


// ---------------- CHECK ADMIN ----------------

async function checkAdmin(){

    const { data: { user } } = await db.auth.getUser();

    if(!user){
        showLogin();
        return;
    }

    const { data: profile, error } = await db
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if(error || !profile || profile.role !== "admin"){

        await db.auth.signOut();

        document.getElementById("loginMessage").innerHTML =
            '<div class="message">This account is not an administrator.</div>';

        showLogin();

        return;
    }

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    loadProducts();
    loadOrders();
}


// ---------------- LOGOUT ----------------

async function logout(){

    await db.auth.signOut();

    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");
}


// ---------------- LOGIN VIEW ----------------

function showLogin(){

    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");

}


// ---------------- PRODUCTS ----------------

async function loadProducts(){

    const box = document.getElementById("products");

    box.innerHTML = "Loading products...";

    const { data, error } = await db
        .from("products")
        .select("*")
        .order("created_at", { ascending:false });

    if(error){

        box.innerHTML =
            '<div class="message">Error loading products: ' +
            error.message +
            '</div>';

        return;
    }

    if(!data || data.length === 0){

        box.innerHTML =
            '<div class="message">No products yet.</div>';

        return;
    }

    box.innerHTML = "";

    data.forEach(product => {

        const image = product.image_url ||
            "https://via.placeholder.com/100";

        const activeText =
            product.active ? "Active" : "Hidden";

        const div = document.createElement("div");

        div.className = "product";

        div.innerHTML = `

            <div class="product-top">

                <img src="${escapeHtml(image)}">

                <div class="product-info">

                    <h3>${escapeHtml(product.name)}</h3>

                    <div>
                        ₦${Number(product.price || 0).toLocaleString()}
                    </div>

                    <div class="small">
                        Category: ${escapeHtml(product.category || "Other")}
                    </div>

                    <div class="small">
                        Stock: ${product.stock || 0}
                        • ${activeText}
                    </div>

                </div>

            </div>

            <div class="actions">

                <button class="edit"
                    onclick="editProduct(${product.id})">
                    Edit
                </button>

                <button class="delete"
                    onclick="deleteProduct(${product.id})">
                    Delete
                </button>

            </div>
        `;

        box.appendChild(div);

    });

}


// ---------------- SAVE PRODUCT ----------------

async function saveProduct(){

    const id = document.getElementById("productId").value;

    const name =
        document.getElementById("productName").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const price =
        Number(document.getElementById("productPrice").value || 0);

    const stock =
        Number(document.getElementById("productStock").value || 0);

    const category =
        document.getElementById("productCategory").value;

    const image_url =
        document.getElementById("productImage").value.trim();

    const active =
        document.getElementById("productActive").checked;

    if(!name){

        showMessage("Enter a product name.");
        return;

    }

    const product = {
        name,
        description,
        price,
        stock,
        category,
        image_url,
        active
    };


    let result;

    if(id){

        result = await db
            .from("products")
            .update(product)
            .eq("id", id);

    }else{

        result = await db
            .from("products")
            .insert(product);

    }


    if(result.error){

        showMessage(
            "Error saving product: " +
            result.error.message
        );

        return;
    }


    showMessage(
        id ? "Product updated successfully." :
        "Product added successfully."
    );

    clearForm();

    loadProducts();

}


// ---------------- EDIT PRODUCT ----------------

async function editProduct(id){

    const { data, error } = await db
        .from("products")
        .select("*")
        .eq("id", id)
        .single();

    if(error){

        showMessage(error.message);
        return;

    }

    document.getElementById("productId").value = data.id;
    document.getElementById("productName").value = data.name || "";
    document.getElementById("productDescription").value =
        data.description || "";
    document.getElementById("productPrice").value =
        data.price || 0;
    document.getElementById("productStock").value =
        data.stock || 0;
    document.getElementById("productCategory").value =
        data.category || "Other Phones";
    document.getElementById("productImage").value =
        data.image_url || "";
    document.getElementById("productActive").checked =
        data.active !== false;

    document.getElementById("formTitle").innerText =
        "Edit Product";

    document.getElementById("cancelEdit")
        .classList.remove("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


// ---------------- DELETE PRODUCT ----------------

async function deleteProduct(id){

    const yes = confirm(
        "Are you sure you want to delete this product?"
    );

    if(!yes) return;


    const { error } = await db
        .from("products")
        .delete()
        .eq("id", id);


    if(error){

        showMessage(
            "Error deleting product: " +
            error.message
        );

        return;
    }


    showMessage("Product deleted.");

    loadProducts();

}


// ---------------- CLEAR FORM ----------------

function clearForm(){

    document.getElementById("productId").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("productDescription").value = "";

    document.getElementById("productPrice").value = "";

    document.getElementById("productStock").value = "";

    document.getElementById("productImage").value = "";

    document.getElementById("productActive").checked = true;

    document.getElementById("formTitle").innerText =
        "Add Product";

    document.getElementById("cancelEdit")
        .classList.add("hidden");

}


function cancelEdit(){

    clearForm();

}


// ---------------- ORDERS ----------------

async function loadOrders(){

    const box = document.getElementById("orders");

    box.innerHTML = "Loading orders...";


    const { data, error } = await db
        .from("orders")
        .select("*")
        .order("created_at", { ascending:false });


    if(error){

        box.innerHTML =
            '<div class="message">Error loading orders: ' +
            error.message +
            '</div>';

        return;
    }


    if(!data || data.length === 0){

        box.innerHTML =
            '<div class="message">No orders yet.</div>';

        return;
    }


    box.innerHTML = "";


    data.forEach(order => {

        const div = document.createElement("div");

        div.className = "order";

        div.innerHTML = `

            <h3>Order #${order.id}</h3>

            <p>
                <strong>Customer:</strong>
                ${escapeHtml(order.customer_name || "")}
            </p>

            <p>
                <strong>Phone:</strong>
                ${escapeHtml(order.customer_phone || "")}
            </p>

            <p>
                <strong>Email:</strong>
                ${escapeHtml(order.customer_email || "")}
            </p>

            <p>
                <strong>Address:</strong>
                ${escapeHtml(order.delivery_address || "")}
            </p>

            <p>
                <strong>Total:</strong>
                ₦${Number(order.total_amount || 0).toLocaleString()}
            </p>

            <p>
                <strong>Payment:</strong>
                ${escapeHtml(order.payment_status || "")}
            </p>

            <label><strong>Order Status</strong></label>

            <select onchange="updateOrderStatus(${order.id}, this.value)">

                <option value="pending"
                    ${order.order_status === "pending" ? "selected":""}>
                    Pending
                </option>

                <option value="confirmed"
                    ${order.order_status === "confirmed" ? "selected":""}>
                    Confirmed
                </option>

                <option value="processing"
                    ${order.order_status === "processing" ? "selected":""}>
                    Processing
                </option>

                <option value="shipped"
                    ${order.order_status === "shipped" ? "selected":""}>
                    Shipped
                </option>

                <option value="delivered"
                    ${order.order_status === "delivered" ? "selected":""}>
                    Delivered
                </option>

                <option value="cancelled"
                    ${order.order_status === "cancelled" ? "selected":""}>
                    Cancelled
                </option>

            </select>

            <div class="small">
                ${new Date(order.created_at).toLocaleString()}
            </div>

        `;

        box.appendChild(div);

    });

}


// ---------------- UPDATE ORDER ----------------

async function updateOrderStatus(id, status){

    const { error } = await db
        .from("orders")
        .update({
            order_status:status
        })
        .eq("id", id);


    if(error){

        showMessage(
            "Could not update order: " +
            error.message
        );

        return;
    }


    showMessage(
        "Order #" + id + " updated to " + status
    );

}


// ---------------- MESSAGE ----------------

function showMessage(text){

    document.getElementById("dashboardMessage").innerHTML =
        '<div class="message">' +
        escapeHtml(text) +
        '</div>';

}


// ---------------- SECURITY ----------------

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// ---------------- START ----------------

(async function(){

    const { data } = await db.auth.getSession();

    if(data && data.session){

        await checkAdmin();

    }else{

        showLogin();

    }

})();

</script>

</body>
</html>
